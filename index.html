
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моє СТО — Календар</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #17243b;
    }
    header {
      background: #17365d;
      color: white;
      padding: 18px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 26px; }
    header p { margin: 5px 0 0; }
    main {
      max-width: 1150px;
      margin: auto;
      padding: 15px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    button {
      background: #1768bd;
      border: none;
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    button.secondary { background: #64748b; }
    button.danger { background: #c62828; }
    #calendar {
      background: white;
      padding: 12px;
      border-radius: 12px;
      min-height: 450px;
    }
    .fc .fc-button { font-size: 13px; }
    .fc-event { cursor: pointer; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #0009;
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }
    .modal.open { display: block; }
    .dialog {
      background: white;
      max-width: 440px;
      margin: 30px auto;
      padding: 22px;
      border-radius: 12px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 11px;
      margin-top: 5px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font: inherit;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    #status { margin: 10px 0; }
    @media (max-width: 600px) {
      .fc .fc-toolbar {
        flex-direction: column;
        gap: 10px;
      }
      .fc .fc-toolbar-title { font-size: 19px; }
      .fc .fc-button { padding: 7px; }
    }
  </style>
</head>
<body>

<header>
  <h1>🔧 Моє СТО</h1>
  <p>Календар записів клієнтів</p>
</header>

<main>
  <div class="toolbar">
    <button onclick="newAppointment()">+ Новий запис</button>
    <button class="secondary" onclick="loadAppointments()">Оновити</button>
    <button class="secondary" id="logout" onclick="logout()" hidden>
      Вийти
    </button>
  </div>
  <p id="status"></p>
  <div id="calendar"></div>
</main>

<div class="modal" id="loginModal">
  <div class="dialog">
    <h2>Вхід працівника</h2>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required>
      <label>Пароль</label>
      <input id="password" type="password" required>
      <div class="actions">
        <button type="submit">Увійти</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="editModal">
  <div class="dialog">
    <h2 id="formTitle">Новий запис</h2>
    <form id="appointmentForm">
      <input type="hidden" id="recordId">

      <label>Клієнт</label>
      <input id="clientName" required>

      <label>Телефон</label>
      <input id="phone" type="tel">

      <label>Автомобіль</label>
      <input id="car">

      <label>Дата</label>
      <input id="date" type="date" required>

      <label>Початок</label>
      <input id="startTime" type="time" required>

      <label>Закінчення</label>
      <input id="endTime" type="time" required>

      <label>Опис робіт</label>
      <textarea id="notes" rows="3"></textarea>

      <div class="actions">
        <button type="submit">Зберегти</button>
        <button type="button" class="secondary"
          onclick="closeEditor()">Скасувати</button>
        <button type="button" class="danger" id="deleteButton"
          onclick="deleteAppointment()" hidden>Видалити</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Заповнимо після отримання даних Supabase.
  const SUPABASE_URL = "https://ryypafbjrtnkbupgssvl.supabase.co/rest/v1/;"
  const SUPABASE_ANON_KEY = "sb_publishable_NxLBp6Bff1jOLsnq3uhBxw_IGAAjxpo";

  let db = null;
  let calendar;
  let records = [];

  const $ = id => document.getElementById(id);
  const status = message => $("status").textContent = message;

  function configured() {
    return !SUPABASE_URL.startsWith("YOUR_") &&
           !SUPABASE_ANON_KEY.startsWith("YOUR_");
  }

  function localDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function localTime(d) {
    return String(d.getHours()).padStart(2, "0") + ":" +
           String(d.getMinutes()).padStart(2, "0");
  }

  function openModal(id) {
    $(id).classList.add("open");
  }

  function closeModal(id) {
    $(id).classList.remove("open");
  }

  function closeEditor() {
    closeModal("editModal");
  }

  function newAppointment(date = new Date()) {
    if (!db) {
      status("Спочатку підключіть Supabase.");
      return;
    }
    $("appointmentForm").reset();
    $("recordId").value = "";
    $("formTitle").textContent = "Новий запис";
    $("deleteButton").hidden = true;
    $("date").value = localDate(date);
    $("startTime").value = "09:00";
    $("endTime").value = "10:00";
    openModal("editModal");
  }

  function editAppointment(id) {
    const r = records.find(x => String(x.id) === String(id));
    if (!r) return;
    $("recordId").value = r.id;
    $("clientName").value = r.client_name || "";
    $("phone").value = r.phone || "";
    $("car").value = r.car || "";
    $("notes").value = r.notes || "";
    const start = new Date(r.start_time);
    const end = new Date(r.end_time);
    $("date").value = localDate(start);
    $("startTime").value = localTime(start);
    $("endTime").value = localTime(end);
    $("formTitle").textContent = "Редагувати запис";
    $("deleteButton").hidden = false;
    openModal("editModal");
  }

  async function loadAppointments() {
    if (!db) return;
    const { data, error } = await db
      .from("appointments")
      .select("*")
      .order("start_time");

    if (error) {
      status("Помилка завантаження: " + error.message);
      return;
    }

    records = data || [];
    calendar.removeAllEvents();

    for (const r of records) {
      calendar.addEvent({
        id: String(r.id),
        title: `${r.client_name || "Клієнт"} — ${r.car || "Авто"}`,
        start: r.start_time,
        end: r.end_time,
        backgroundColor: "#1768bd"
      });
    }
    status(`Записів: ${records.length}`);
  }

  $("appointmentForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!db) return;

    const date = $("date").value;
    const start = new Date(`${date}T${$("startTime").value}`);
    const end = new Date(`${date}T${$("endTime").value}`);

    if (end <= start) {
      alert("Час закінчення має бути пізніше початку.");
      return;
    }

    const item = {
      client_name: $("clientName").value.trim(),
      phone: $("phone").value.trim(),
      car: $("car").value.trim(),
      notes: $("notes").value.trim(),
      start_time: start.toISOString(),
      end_time: end.toISOString()
    };

    const id = $("recordId").value;
    const query = id
      ? db.from("appointments").update(item).eq("id", id)
      : db.from("appointments").insert(item);

    const { error } = await query;

    if (error) {
      alert("Помилка збереження: " + error.message);
      return;
    }

    closeEditor();
    await loadAppointments();
  });

  async function deleteAppointment() {
    const id = $("recordId").value;
    if (!id || !confirm("Видалити цей запис?")) return;

    const { error } = await db
      .from("appointments")
      .delete()
      .eq("id", id);

    if (error) {
      alert("Помилка видалення: " + error.message);
      return;
    }

    closeEditor();
    await loadAppointments();
  }

  async function logout() {
    await db.auth.signOut();
    location.reload();
  }

  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!db) return;

    const { error } = await db.auth.signInWithPassword({
      email: $("email").value,
      password: $("password").value
    });

    if (error) {
      alert("Помилка входу: " + error.message);
      return;
    }

    closeModal("loginModal");
    $("logout").hidden = false;
    await loadAppointments();
  });

  document.addEventListener("DOMContentLoaded", async () => {
    calendar = new FullCalendar.Calendar($("calendar"), {
      locale: "uk",
      initialView: window.innerWidth < 650
        ? "timeGridDay" : "timeGridWeek",
      firstDay: 1,
      height: "auto",
      nowIndicator: true,
      slotMinTime: "07:00:00",
      slotMaxTime: "22:00:00",
      allDaySlot: false,
      headerToolbar: {
        left: "prev,next today",
        center: "title",
        right: "dayGridMonth,timeGridWeek,timeGridDay"
      },
      buttonText: {
        today: "Сьогодні",
        month: "Місяць",
        week: "Тиждень",
        day: "День"
      },
      dateClick: info => newAppointment(info.date),
      eventClick: info => editAppointment(info.event.id)
    });

    calendar.render();

    if (!configured()) {
      status("Календар готовий. Потрібно підключити Supabase.");
      return;
    }

    db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const { data } = await db.auth.getSession();

    if (data.session) {
      $("logout").hidden = false;
      await loadAppointments();
    } else {
      openModal("loginModal");
    }
  });
</script>
</body>
</html>
